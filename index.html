<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÔN THI IOE - Ruby School</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruby: {
                            light: '#ffe5e5',
                            DEFAULT: '#e60000', // Ruby School Red
                            dark: '#b30000',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #e60000; }

        /* Fullscreen Container for Quiz */
        .quiz-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
            transition: all 0.3s ease;
        }

        /* Glassmorphism Modals */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }

        /* Hide elements dynamically */
        .hidden { display: none !important; }
        
        .tab-btn.active {
            border-bottom: 3px solid #e60000;
            color: #e60000;
            font-weight: 600;
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative">

    <!-- Modal Container -->
    <div id="global-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden transform transition-all scale-100 p-6 flex flex-col items-center text-center">
            <div id="modal-icon" class="text-5xl mb-4 text-ruby">
                <i class="fas fa-exclamation-circle"></i>
            </div>
            <h3 id="modal-title" class="text-2xl font-bold text-gray-800 mb-2">Tiêu đề</h3>
            <p id="modal-desc" class="text-gray-600 mb-6">Nội dung thông báo.</p>
            <div id="modal-actions" class="flex gap-3 w-full justify-center">
                <!-- Buttons injected via JS -->
            </div>
        </div>
    </div>

    <!-- SCREEN: START -->
    <div id="screen-start" class="w-full h-full flex items-center justify-center bg-ruby-light/30 relative">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-lg p-10 border-t-8 border-ruby relative">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-ruby text-white rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg shadow-ruby/40">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">ÔN THI IOE</h1>
                <p class="text-ruby font-semibold mt-1">Ruby School</p>
            </div>

            <form id="start-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Họ và Tên</label>
                    <input type="text" id="student-name" required placeholder="Nhập họ và tên của bạn" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-ruby focus:border-ruby outline-none transition-all">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Chọn Lớp</label>
                        <select id="student-grade" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-ruby focus:border-ruby outline-none transition-all bg-white">
                            <option value="" disabled selected>Chọn Lớp...</option>
                            <option value="3">Lớp 3</option>
                            <option value="4">Lớp 4</option>
                            <option value="5">Lớp 5</option>
                            <option value="6">Lớp 6</option>
                            <option value="7">Lớp 7</option>
                            <option value="8">Lớp 8</option>
                            <option value="9">Lớp 9</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Vòng Thi</label>
                        <select id="exam-round" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-ruby focus:border-ruby outline-none transition-all bg-white">
                            <option value="" disabled selected>Chọn Vòng...</option>
                            <option value="1">1. Vòng Trường</option>

                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Chuyên đề</label>

                            <option value="full-2">Chuyên đề 2</option>
                            <option value="full-3">Chuyên đề 3</option>
                            <option value="full-4">Chuyên đề 4</option>
                            <option value="full-5">Chuyên đề 5</option>
                            <option value="full-6">Chuyên đề 6</option>
                            <option value="full-7">Chuyên đề 7</option>

            </form>
            
            <!-- Secret Teacher Key Input (Discreet) -->

        </div>
    </div>

    <!-- SCREEN: QUIZ -->
    <div id="screen-quiz" class="hidden w-full h-full bg-white flex flex-col">
        <!-- Main Quiz Container (Full Screen) -->

            <!-- Header -->

                <div class="flex items-center gap-6">
                    <div class="text-center">

                        <div id="timer" class="font-mono text-xl font-bold text-gray-800">00:00</div>

            </div>

            <!-- Body Area -->

                    <div class="p-4 bg-gray-50 border-b border-gray-200">

                            Danh sách câu <span id="answered-count" class="text-ruby bg-ruby-light px-2 py-0.5 rounded-full text-xs">0/0</span>

                    <!-- Tabs for Parts -->
                    <div id="part-tabs" class="flex md:flex-col overflow-x-auto border-b md:border-b-0 border-gray-200">

                    </div>

                    <!-- Question Grid for Current Part -->
                    <div class="flex-1 overflow-y-auto p-4">
                        <div id="question-grid" class="grid grid-cols-5 md:grid-cols-4 gap-2">
                            <!-- Number buttons injected via JS -->
                        </div>
                    </div>
                </aside>

                <!-- Right Main Content (Question & Answers Side-by-Side) -->
                <main class="flex-1 flex flex-col h-full relative p-6 md:p-8">
                    
                    <div class="flex-1 flex flex-col lg:flex-row gap-8 overflow-y-auto">
                        <!-- Question Side -->
                        <div class="flex-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center relative">

                        </div>
                        
                        <!-- Answers Side -->
                        <div class="flex-1 flex flex-col justify-center gap-4" id="options-container">

                        </div>
                    </div>

                    <!-- Bottom Controls -->
                    <div class="pt-6 mt-4 border-t border-gray-200 flex justify-between items-center shrink-0">

                        <button id="btn-next" class="px-5 py-2.5 rounded-lg font-semibold bg-gray-800 text-white hover:bg-black shadow-md transition-colors">

    <!-- SCREEN: RESULT -->
    <div id="screen-result" class="hidden w-full h-full overflow-y-auto bg-gray-50 flex items-center justify-center p-4">
        <div class="bg-white max-w-3xl w-full rounded-3xl shadow-2xl overflow-hidden">
            <!-- Header Pattern -->
            <div class="bg-ruby p-8 text-center relative overflow-hidden">
                <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 20px 20px;"></div>
                <h1 class="text-4xl font-extrabold text-white relative z-10 mb-2">Hoàn thành bài thi!</h1>
                <p id="result-name-class" class="text-ruby-light font-medium relative z-10 text-lg">Họ và tên - Lớp X</p>
            </div>
            
            <div class="p-8 md:p-12">
                <div class="flex flex-col md:flex-row items-center justify-around mb-10 gap-8">
                    <!-- Score Circle -->
                    <div class="relative w-48 h-48 flex items-center justify-center">

                            <circle id="score-circle" cx="50" cy="50" r="45" fill="none" stroke="#e60000" stroke-width="8" stroke-dasharray="283" stroke-dashoffset="283" class="transition-all duration-1000 ease-out"></circle>
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                            <span id="score-percent" class="text-4xl font-black text-gray-800">0%</span>
                            <span id="score-text" class="text-sm font-semibold text-gray-500 mt-1">0 / 0 điểm</span>
                        </div>
                    </div>
                    
                    <!-- Stats Grid -->
                    <div class="grid grid-cols-2 gap-4 w-full md:w-auto">
                        <div class="bg-green-50 rounded-xl p-4 border border-green-100 text-center">
                            <div class="text-green-500 text-xl mb-1"><i class="fas fa-check-circle"></i></div>
                            <div class="text-2xl font-bold text-green-700" id="stat-correct">0</div>
                            <div class="text-xs font-semibold text-green-600 uppercase">Đúng</div>
                        </div>
                        <div class="bg-red-50 rounded-xl p-4 border border-red-100 text-center">
                            <div class="text-red-500 text-xl mb-1"><i class="fas fa-times-circle"></i></div>
                            <div class="text-2xl font-bold text-red-700" id="stat-wrong">0</div>
                            <div class="text-xs font-semibold text-red-600 uppercase">Sai</div>
                        </div>

                            <div class="text-blue-500 text-xl mb-1"><i class="fas fa-clock"></i></div>
                            <div class="text-2xl font-bold text-blue-700" id="stat-time">00:00</div>

                <!-- Actions -->

                    <button id="btn-review" class="flex-1 py-4 px-6 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold rounded-xl transition-colors flex items-center justify-center gap-2 border border-gray-200">
                        <i class="fas fa-list-check"></i> Xem lại đáp án

    <!-- SCREEN: REVIEW -->
    <div id="screen-review" class="hidden w-full h-full overflow-hidden bg-gray-100 flex flex-col">
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shrink-0 shadow-sm z-10">
            <div class="flex items-center gap-3">
                <button id="btn-back-result" class="w-10 h-10 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-full flex items-center justify-center transition-colors">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h2 class="font-bold text-gray-800 text-xl">Xem lại đáp án</h2>
            </div>
            <div class="text-ruby font-bold">ÔN THI IOE</div>
        </header>
        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <div class="max-w-4xl mx-auto space-y-6" id="review-container">
                <!-- Review cards injected here -->
            </div>
        </main>
    </div>

    <script>
        // --- STREAMING_CHUNK:Quản lý Biến Trạng Thái ---
        let appState = {
            studentName: '',
            grade: '',
            examRoundText: '',
            targetCount: 0,
            isTeacher: false,
            deviceType: 'laptop', // Default setting
            
            questions: [],
            answers: {}, // { questionId: selectedOption }
            currentQuestionIndex: 0,
            currentTab: 0, // grouping 5 questions per tab
            
            startTime: null,
            timerInterval: null,
            timeElapsed: 0, // seconds since the quiz started, counts up with no limit

            isTesting: false,
            retryMode: false // true if user is re-doing wrong answers
        };

        const POINTS_PER_QUESTION = 10;
        const QUESTIONS_PER_TAB = 5;

        // --- STREAMING_CHUNK:Utility Functions & Modals ---
        
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        const modal = {
            show: (title, desc, buttons, icon = 'fa-exclamation-circle', iconColor = 'text-ruby') => {
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-desc').innerHTML = desc;
                
                const iconEl = document.getElementById('modal-icon');
                iconEl.className = `text-5xl mb-4 ${iconColor}`;
                iconEl.innerHTML = `<i class="fas ${icon}"></i>`;
                
                const actionsEl = document.getElementById('modal-actions');
                actionsEl.innerHTML = '';
                
                buttons.forEach(btn => {
                    const b = document.createElement('button');
                    b.className = `flex-1 py-3 px-4 rounded-xl font-bold transition-all transform active:scale-95 ${btn.class}`;
                    b.textContent = btn.text;
                    b.onclick = () => {
                        if(btn.onClick) btn.onClick();
                        if(btn.close !== false) modal.hide();
                    };
                    actionsEl.appendChild(b);
                });
                
                document.getElementById('global-modal').classList.remove('hidden');
            },
            hide: () => {
                document.getElementById('global-modal').classList.add('hidden');
            }
        };

        // Screen Navigation
        function showScreen(screenId) {
            ['screen-start', 'screen-quiz', 'screen-result', 'screen-review'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        // --- STREAMING_CHUNK:App Initialization & Start Logic ---

        document.getElementById('teacher-key').addEventListener('input', (e) => {
            if (e.target.value === '968903') {
                appState.isTeacher = true;
                e.target.style.backgroundColor = '#dcfce7'; // green success
                modal.show('Thành công', 'Đã xác nhận tài khoản Giáo viên. Bạn có thể nộp bài bất cứ lúc nào.', [{text: 'Đóng', class: 'bg-green-500 text-white'}], 'fa-check-circle', 'text-green-500');
                setTimeout(() => e.target.value = '', 1500);
            }
        });

        // --- STREAMING_CHUNK:Tải dữ liệu từ File JSON ---
        
        // Thuật toán xáo trộn mảng Fisher-Yates để đảm bảo tính ngẫu nhiên 100%
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function fetchQuestions(fileName, count) {
            try {
                modal.show('Đang tải dữ liệu...', 'Vui lòng chờ trong giây lát...', [], 'fa-spinner fa-spin', 'text-blue-500');
                
                const fetchUrl = `./${fileName}`; 
                const response = await fetch(fetchUrl);
                
                if (!response.ok) {
                    throw new Error(`Không tìm thấy file: <b>${fileName}</b>.<br><br>Hãy kiểm tra lại tên file trên Github.`);
                }
                
                let rawData = await response.json();
                modal.hide();

                let processedData = [];

                // Hàm hỗ trợ xử lý chung cho các phần (Part A, Part B, Part C)
                const processPart = (partData) => {
                    if (!partData) return;
                    partData.forEach(item => {
                        let optsArray = [];
                        if (item.options) {
                            if (typeof item.options === 'string') {
                                optsArray = item.options.split(/,\s*(?=[A-D]\.)/);
                            } else {
                                optsArray = item.options;
                            }
                        }

                        processedData.push({
                            q: item.question || item.q,
                            opts: optsArray,
                            ans: item.answer || item.ans,
                            exp: item.explanation || item.exp || "Không có giải thích chi tiết."
                        });
                    });
                };

                // Lấy dữ liệu từ Part A, Part B, và Part C (nếu có)
                if (rawData.part_A || rawData.part_B || rawData.part_C) {
                    processPart(rawData.part_A);
                    processPart(rawData.part_B);
                    processPart(rawData.part_C);
                } else {
                    // Dự phòng nếu tải cấu trúc JSON cũ (dạng mảng trực tiếp)
                    processedData = rawData;
                }

                // Trộn câu hỏi ngẫu nhiên
                processedData = shuffleArray(processedData);

                if (count && count > 0) {
                    processedData = processedData.slice(0, count);
                }

                return processedData.map((item, index) => {
                    let questionText = item.q || "";
                    let cleanQuestion = questionText.replace(/\[[^\]]+\]/g, "").trim();

                    let answerText = item.ans || "";
                    let cleanAnswer = answerText.replace(/\[[^\]]+\]/g, "").trim();

                    let finalOpts = item.opts ? shuffleArray([...item.opts]).map(opt => {
                        return typeof opt === 'string' ? opt.replace(/\[[^\]]+\]/g, "").trim() : opt;
                    }) : [];

                    return {
                        id: index + 1,
                        text: cleanQuestion,
                        options: finalOpts,
                        correct: cleanAnswer,
                        explanation: item.exp || "Không có giải thích chi tiết."
                    };
                });
            } catch (error) {
                console.error("Error loading JSON:", error);
                modal.hide();
                modal.show(
                    'Lỗi tải dữ liệu đề thi', 
                    `<div class="text-left bg-red-50 p-3 rounded-lg border border-red-200 mt-2 text-sm text-red-700">${error.message}</div>`, 
                    [{text: 'Đóng', class: 'bg-ruby text-white'}]
                );
                return null;
            }
        }

        document.getElementById('start-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('student-name').value.trim();
            const grade = document.getElementById('student-grade').value;
            const round = document.getElementById('exam-round').value;
            const mode = document.getElementById('test-mode').value;
            const passcode = document.getElementById('passcode').value;

            if (passcode !== '1235' && !appState.isTeacher) {
                modal.show('Sai mã xác nhận', 'Vui lòng nhập đúng mã xác nhận để làm bài.', [{text: 'Thử lại', class: 'bg-ruby text-white'}]);
                return;
            }

            appState.studentName = name;
            appState.grade = grade;
            appState.examRoundText = document.getElementById('exam-round').options[document.getElementById('exam-round').selectedIndex].text;

            const topic = mode.split('-')[1];
            const fileName = `json${grade}.vong${round}.${topic}.json`;
            const targetCount = 200;

            const qs = await fetchQuestions(fileName, targetCount);
            if (qs && qs.length > 0) {
                appState.questions = qs;
                appState.answers = {};
                appState.currentQuestionIndex = 0;
                
                try {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    }
                } catch(err) {
                    console.log("Trình duyệt không hỗ trợ full screen tự động");
                }

                initQuizEnvironment();
            } else if (qs && qs.length === 0) {
                 modal.show('Thông báo', 'File dữ liệu trống hoặc không có câu hỏi nào.', [{text: 'Đóng', class: 'bg-gray-500 text-white'}]);
            }
        });

        function initQuizEnvironment() {
            showScreen('screen-quiz');
            document.getElementById('quiz-student-info').textContent = `${appState.studentName} - Lớp ${appState.grade} (${appState.examRoundText})`;
            
            document.getElementById('question-grid').innerHTML = '';
            
            renderQuestionList();
            renderQuestion(0);
            startTimer();
            updateProgress();
        }

        function renderQuestionList() {
            const grid = document.getElementById('question-grid');
            grid.innerHTML = '';
            
            appState.questions.forEach((q, index) => {
                const btn = document.createElement('button');
                btn.className = `w-10 h-10 rounded-lg font-bold text-sm flex items-center justify-center transition-colors border-2 shadow-sm
                    ${appState.answers[q.id] ? 'bg-ruby text-white border-ruby' : 'bg-white text-gray-600 border-gray-200 hover:border-ruby'}`;
                btn.textContent = index + 1;
                btn.id = `nav-btn-${index}`;
                btn.onclick = () => renderQuestion(index);
                grid.appendChild(btn);
            });
            updateAnsweredCount();
        }

        function renderQuestion(index) {
            if (index < 0 || index >= appState.questions.length) return;
            
            const oldBtn = document.getElementById(`nav-btn-${appState.currentQuestionIndex}`);
            if(oldBtn && !appState.answers[appState.questions[appState.currentQuestionIndex].id]) {
                oldBtn.classList.remove('ring-4', 'ring-ruby-light', 'border-ruby');
            } else if (oldBtn) {
                oldBtn.classList.remove('ring-4', 'ring-ruby-light');
            }

            appState.currentQuestionIndex = index;
            const q = appState.questions[index];
            
            const newBtn = document.getElementById(`nav-btn-${index}`);
            if (newBtn) {
                newBtn.classList.add('ring-4', 'ring-ruby-light');
                if(!appState.answers[q.id]) newBtn.classList.add('border-ruby');
                newBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            document.getElementById('current-q-label').textContent = `Câu ${index + 1} / ${appState.questions.length}`;
            document.getElementById('question-text').innerHTML = q.text;

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';

            if (q.options && q.options.length > 0) {
                const labels = ['A', 'B', 'C', 'D', 'E', 'F'];
                q.options.forEach((opt, i) => {
                    const isSelected = appState.answers[q.id] === opt;
                    const optBtn = document.createElement('button');
                    optBtn.className = `w-full text-left p-4 md:p-5 rounded-xl border-2 transition-all flex items-center gap-4 group
                        ${isSelected ? 'border-ruby bg-ruby-light/30' : 'border-gray-200 bg-white hover:border-ruby/50 hover:bg-gray-50'}`;

                    optBtn.innerHTML = `
                        <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold shrink-0 transition-colors
                            ${isSelected ? 'bg-ruby text-white' : 'bg-gray-100 text-gray-500 group-hover:bg-gray-200'}">
                            ${labels[i]}
                        </div>
                        <div class="text-gray-800 font-medium text-lg flex-1">${opt}</div>
                        <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0
                            ${isSelected ? 'border-ruby' : 'border-gray-300'}">
                            ${isSelected ? '<div class="w-3 h-3 bg-ruby rounded-full"></div>' : ''}
                        </div>
                    `;

                    optBtn.onclick = () => selectOption(q.id, opt);
                    optsContainer.appendChild(optBtn);
                });
            } else {
                optsContainer.innerHTML = `
                    <label class="text-sm font-semibold text-gray-500">Gõ từ/cụm từ còn thiếu:</label>
                    <input type="text" id="fill-answer-input" autocomplete="off" spellcheck="false"
                        class="w-full px-5 py-4 rounded-xl border-2 border-gray-200 focus:border-ruby focus:ring-2 focus:ring-ruby-light/50 outline-none transition-all text-xl font-medium text-gray-800"
                        placeholder="Nhập đáp án của bạn...">
                `;
                const input = document.getElementById('fill-answer-input');
                input.value = appState.answers[q.id] || '';
                input.addEventListener('input', (e) => inputTextAnswer(q.id, e.target.value));
                input.focus();
            }

            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            
            if (index === 0) {
                btnPrev.classList.add('invisible');
            } else {
                btnPrev.classList.remove('invisible');
            }
            
            if (index === appState.questions.length - 1) {
                btnNext.innerHTML = '<i class="fas fa-check mr-2"></i> Hoàn thành';
                btnNext.classList.remove('bg-gray-800', 'hover:bg-black');
                btnNext.classList.add('bg-green-600', 'hover:bg-green-700');
            } else {
                btnNext.innerHTML = 'Tiếp theo <i class="fas fa-arrow-right ml-2"></i>';
                btnNext.classList.remove('bg-green-600', 'hover:bg-green-700');
                btnNext.classList.add('bg-gray-800', 'hover:bg-black');
            }
        }

        function selectOption(questionId, option) {
            appState.answers[questionId] = option;
            renderQuestion(appState.currentQuestionIndex);

            const btn = document.getElementById(`nav-btn-${appState.currentQuestionIndex}`);
            if (btn) {
                btn.classList.remove('bg-white', 'text-gray-600', 'border-gray-200');
                btn.classList.add('bg-ruby', 'text-white', 'border-ruby');
            }

            updateAnsweredCount();
            updateProgress();
        }

        function inputTextAnswer(questionId, value) {
            if (value.trim() === '') {
                delete appState.answers[questionId];
            } else {
                appState.answers[questionId] = value;
            }

            const btn = document.getElementById(`nav-btn-${appState.currentQuestionIndex}`);
            if (btn) {
                const isAnswered = appState.answers[questionId] !== undefined;
                btn.classList.toggle('bg-ruby', isAnswered);
                btn.classList.toggle('text-white', isAnswered);
                btn.classList.toggle('border-ruby', isAnswered);
                btn.classList.toggle('bg-white', !isAnswered);
                btn.classList.toggle('text-gray-600', !isAnswered);
                btn.classList.toggle('border-gray-200', !isAnswered);
            }

            updateAnsweredCount();
            updateProgress();
        }

        // Với dạng "Điền từ", đáp án gốc có thể ghi dạng "cal (medical)" nghĩa là
        // chỉ cần gõ phần trước dấu ngoặc để hoàn thành từ còn thiếu.
        function getFillAnswer(correctText) {
            const match = correctText.match(/^(.*?)\s*\(/);
            return (match ? match[1] : correctText).trim().toLowerCase();
        }

        function isAnswerCorrect(q) {
            const userAns = appState.answers[q.id];
            if (userAns === undefined) return false;
            if (q.options && q.options.length > 0) {
                return userAns === q.correct;
            }
            return userAns.trim().toLowerCase() === getFillAnswer(q.correct);
        }

        function updateAnsweredCount() {
            const answered = Object.keys(appState.answers).length;
            document.getElementById('answered-count').textContent = `${answered}/${appState.questions.length}`;
        }

        function updateProgress() {
            const answered = Object.keys(appState.answers).length;
            const percent = (answered / appState.questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        document.getElementById('btn-prev').onclick = () => renderQuestion(appState.currentQuestionIndex - 1);
        
        document.getElementById('btn-next').onclick = () => {
            if (appState.currentQuestionIndex === appState.questions.length - 1) {
                confirmSubmit();
            } else {
                renderQuestion(appState.currentQuestionIndex + 1);
            }
        };

        document.getElementById('btn-submit-top').onclick = confirmSubmit;

        function startTimer() {
            appState.startTime = Date.now();
            appState.timerInterval = setInterval(() => {
                appState.timeElapsed++;
                document.getElementById('timer').textContent = formatTime(appState.timeElapsed);
            }, 1000);
        }

        function stopTimer() {
            clearInterval(appState.timerInterval);

            try {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                }
            } catch(e) {}
        }

        function confirmSubmit() {
            const answered = Object.keys(appState.answers).length;
            const total = appState.questions.length;
            
            if (appState.isTeacher) {
                submitQuiz(); 
                return;
            }

            if (answered < total) {
                modal.show('Chưa hoàn thành', `Bạn mới làm ${answered}/${total} câu. Bạn có chắc chắn muốn nộp bài sớm không?`, [
                    {text: 'Quay lại làm tiếp', class: 'bg-gray-200 text-gray-800'},
                    {text: 'Vẫn nộp bài', class: 'bg-ruby text-white', onClick: submitQuiz}
                ], 'fa-question-circle', 'text-yellow-500');
            } else {
                modal.show('Xác nhận nộp bài', 'Bạn đã hoàn thành tất cả câu hỏi. Bạn có chắc chắn nộp không?', [
                    {text: 'Kiểm tra lại', class: 'bg-gray-200 text-gray-800'},
                    {text: 'Nộp bài', class: 'bg-ruby text-white', onClick: submitQuiz}
                ], 'fa-check-circle', 'text-green-500');
            }
        }

        function submitQuiz() {
            stopTimer();
            showScreen('screen-result');
            
            let correctCount = 0;
            appState.questions.forEach(q => {
                if (isAnswerCorrect(q)) {
                    correctCount++;
                }
            });
            
            const total = appState.questions.length;
            const wrongCount = total - correctCount;
            const score = correctCount * POINTS_PER_QUESTION;
            const totalScore = total * POINTS_PER_QUESTION;
            const percent = Math.round((correctCount / total) * 100);
            
            document.getElementById('result-name-class').textContent = `${appState.studentName} - Lớp ${appState.grade} (${appState.examRoundText})`;

            document.getElementById('stat-correct').textContent = correctCount;
            document.getElementById('stat-wrong').textContent = wrongCount;
            document.getElementById('stat-time').textContent = formatTime(appState.timeElapsed);
            
            document.getElementById('score-text').textContent = `${score} / ${totalScore} điểm`;
            
            let currentPercent = 0;
            const percentEl = document.getElementById('score-percent');
            const circle = document.getElementById('score-circle');
            
            const interval = setInterval(() => {
                if (currentPercent >= percent) {
                    clearInterval(interval);
                    
                    if (percent >= 85 && percent < 100 && !appState.retryMode && !appState.isTeacher) {
                        setTimeout(() => {
                            modal.show('Tuyệt vời!', `Bạn đã đạt ${percent}%. Bạn có muốn làm lại các câu sai để đạt điểm tối đa không?`, [
                                {text: 'Bỏ qua', class: 'bg-gray-200 text-gray-800'},
                                {text: 'Làm lại câu sai', class: 'bg-green-500 text-white', onClick: startRetryMode}
                            ], 'fa-star', 'text-yellow-400');
                        }, 1000);
                    } else {
                         setTimeout(() => {
                             modal.show('Hoàn thành', 'Hãy chụp ảnh màn hình hoặc thông báo kết quả bạn vừa đạt được cho Form Teacher của bạn nhé!', [{text: 'Đã hiểu', class: 'bg-ruby text-white'}]);
                         }, 1000);
                    }
                    
                } else {
                    currentPercent++;
                    percentEl.textContent = `${currentPercent}%`;
                    const offset = 283 - (283 * currentPercent) / 100;
                    circle.style.strokeDashoffset = offset;
                }
            }, 20);
        }

        function startRetryMode() {
            appState.retryMode = true;
            
            const wrongQuestions = appState.questions.filter(q => !isAnswerCorrect(q));
            appState.questions = wrongQuestions;
            
            appState.answers = {};
            appState.currentQuestionIndex = 0;
            appState.timeElapsed = 0;

            initQuizEnvironment();
        }

        document.getElementById('btn-review').onclick = () => {
            showScreen('screen-review');
            const container = document.getElementById('review-container');
            container.innerHTML = '';
            
            appState.questions.forEach((q, index) => {
                const isCorrect = isAnswerCorrect(q);
                const card = document.createElement('div');
                card.className = `bg-white p-6 rounded-2xl shadow-sm border-l-4 ${isCorrect ? 'border-green-500' : 'border-red-500'}`;

                let optsHtml = '';
                if (q.options && q.options.length > 0) {
                    const labels = ['A', 'B', 'C', 'D', 'E', 'F'];
                    q.options.forEach((opt, i) => {
                        const isUserAns = appState.answers[q.id] === opt;
                        const isActualAns = q.correct === opt;

                        let bgClass = 'bg-gray-50';
                        let textClass = 'text-gray-700';
                        let icon = '';
                        let borderClass = 'border-gray-200';

                        if (isActualAns) {
                            bgClass = 'bg-green-50';
                            textClass = 'text-green-800 font-bold';
                            borderClass = 'border-green-300';
                            icon = '<i class="fas fa-check-circle text-green-500 ml-2"></i>';
                        } else if (isUserAns && !isCorrect) {
                            bgClass = 'bg-red-50';
                            textClass = 'text-red-800';
                            borderClass = 'border-red-300';
                            icon = '<i class="fas fa-times-circle text-red-500 ml-2"></i>';
                        }

                        optsHtml += `
                            <div class="p-3 rounded-lg border ${borderClass} ${bgClass} ${textClass} flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <span class="w-6 h-6 rounded-full bg-white border flex items-center justify-center text-sm ${isActualAns ? 'border-green-500 text-green-600' : isUserAns ? 'border-red-500 text-red-600' : 'border-gray-300 text-gray-500'}">${labels[i]}</span>
                                    <span>${opt}</span>
                                </div>
                                ${icon}
                            </div>
                        `;
                    });
                } else {
                    const userVal = appState.answers[q.id];
                    const userDisplay = userVal !== undefined ? escapeHtml(userVal) : '(Không trả lời)';
                    optsHtml = `
                        <div class="p-3 rounded-lg border ${isCorrect ? 'border-green-300 bg-green-50' : 'border-red-300 bg-red-50'}">
                            <span class="text-sm text-gray-500">Câu trả lời của bạn: </span>
                            <span class="font-bold ${isCorrect ? 'text-green-800' : 'text-red-800'}">${userDisplay}</span>
                        </div>
                        <div class="p-3 rounded-lg border border-green-300 bg-green-50">
                            <span class="text-sm text-gray-500">Đáp án đúng: </span>
                            <span class="font-bold text-green-800">${escapeHtml(q.correct)}</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <h4 class="font-bold text-gray-800 text-lg">Câu ${index + 1}: ${q.text}</h4>
                        <span class="px-3 py-1 rounded-full text-sm font-bold ${isCorrect ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                            ${isCorrect ? 'Đúng' : 'Sai'}
                        </span>
                    </div>
                    <div class="space-y-2 mb-4">
                        ${optsHtml}
                    </div>
                    <div class="bg-blue-50 border border-blue-100 rounded-lg p-4 text-blue-800 text-sm">
                        <span class="font-bold"><i class="fas fa-lightbulb text-yellow-500 mr-1"></i> Giải thích:</span> 
                        ${q.explanation}
                    </div>
                `;
                container.appendChild(card);
            });
        };

        document.getElementById('btn-back-result').onclick = () => {
            showScreen('screen-result');
        };

    </script>
</body>
</html>
