<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÔN THI IOE - Ruby School</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruby: {
                            light: '#ffe5e5',
                            DEFAULT: '#e60000', // Ruby School Red
                            dark: '#b30000',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #e60000; }

        /* Aspect Ratio Container for Quiz */
        .quiz-container {
            width: 100%;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
            transition: all 0.3s ease;
        }

        .ratio-4-3 {
            aspect-ratio: 4/3;
            max-width: 1200px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        .ratio-tablet {
            max-width: 100%;
            height: 100vh;
            border-radius: 0;
            font-size: 110%;
        }

        /* Glassmorphism Modals */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }

        /* Hide elements dynamically */
        .hidden { display: none !important; }
        
        .tab-btn.active {
            border-bottom: 3px solid #e60000;
            color: #e60000;
            font-weight: 600;
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative">

    <!-- Modal Container -->
    <div id="global-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden transform transition-all scale-100 p-6 flex flex-col items-center text-center">
            <div id="modal-icon" class="text-5xl mb-4 text-ruby">
                <i class="fas fa-exclamation-circle"></i>
            </div>
            <h3 id="modal-title" class="text-2xl font-bold text-gray-800 mb-2">Tiêu đề</h3>
            <p id="modal-desc" class="text-gray-600 mb-6">Nội dung thông báo.</p>
            <div id="modal-actions" class="flex gap-3 w-full justify-center">
                <!-- Buttons injected via JS -->
            </div>
        </div>
    </div>

    <!-- SCREEN: START -->
    <div id="screen-start" class="w-full h-full flex items-center justify-center bg-ruby-light/30 relative">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-lg p-10 border-t-8 border-ruby relative">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-ruby text-white rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg shadow-ruby/40">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">ÔN THI IOE</h1>
                <p class="text-ruby font-semibold mt-1">Ruby School</p>
            </div>

            <form id="start-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Họ và Tên</label>
                    <input type="text" id="student-name" required placeholder="Nhập họ và tên của bạn" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-ruby focus:border-ruby outline-none transition-all">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Chọn Lớp</label>
                        <select id="student-grade" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-ruby focus:border-ruby outline-none transition-all bg-white">
                            <option value="" disabled selected>Chọn Lớp...</option>
                            <option value="3">Lớp 3</option>
                            <option value="4">Lớp 4</option>
                            <option value="5">Lớp 5</option>
                            <option value="6">Lớp 6</option>
                            <option value="7">Lớp 7</option>
                            <option value="8">Lớp 8</option>
                            <option value="9">Lớp 9</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Vòng Thi</label>
                        <select id="exam-round" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-ruby focus:border-ruby outline-none transition-all bg-white">
                            <option value="" disabled selected>Chọn Vòng...</option>
                            <option value="1">1. Vòng Trường</option>
                            <option value="2">2. Vòng Quận/Huyện</option>
                            <option value="3">3. Vòng Thành Phố</option>
                            <option value="4">4. Vòng Quốc Gia</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Chế độ thi (Chuyên đề / Dạng bài)</label>
                        <div class="flex gap-2">
                            <select id="test-mode" class="flex-1 px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-ruby focus:border-ruby outline-none transition-all bg-white">
                                <optgroup label="Thi toàn diện (10 Chuyên đề)">
                                    <option value="full-1">Chuyên đề 1</option>
                                    <option value="full-2">Chuyên đề 2</option>
                                    <option value="full-3">Chuyên đề 3</option>
                                    <option value="full-4">Chuyên đề 4</option>
                                    <option value="full-5">Chuyên đề 5</option>
                                    <option value="full-6">Chuyên đề 6</option>
                                    <option value="full-7">Chuyên đề 7</option>
                                    <option value="full-8">Chuyên đề 8</option>
                                    <option value="full-9">Chuyên đề 9</option>
                                    <option value="full-10">Chuyên đề 10</option>
                                </optgroup>
                                <optgroup label="Luyện tập theo dạng bài">
                                    <option value="dang-1">Dạng 1: Trắc nghiệm</option>
                                    <option value="dang-2">Dạng 2: Điền từ</option>
                                    <option value="dang-3">Dạng 3: Viết lại câu</option>
                                    <option value="dang-4">Dạng 4: Nghe</option>
                                    <option value="dang-5">Dạng 5: Nhìn tranh</option>
                                </optgroup>
                            </select>
                            
                            <input type="number" id="question-count" min="1" max="199" placeholder="Số câu" class="hidden w-1/3 px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-ruby focus:border-ruby outline-none transition-all bg-white">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Mã xác nhận</label>
                    <input type="password" id="passcode" required placeholder="Nhập mã xác nhận" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-ruby focus:border-ruby outline-none transition-all">
                </div>

                <button type="submit" class="w-full bg-ruby hover:bg-ruby-dark text-white font-bold py-4 rounded-xl shadow-lg transform transition-all active:scale-95 text-lg mt-4">
                    BẮT ĐẦU LÀM BÀI <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </form>
            
            <!-- Secret Teacher Key Input (Discreet) -->
            <input type="password" id="teacher-key" placeholder="Key GV" class="absolute bottom-2 right-2 w-16 text-[10px] p-1 border-none bg-transparent text-gray-300 focus:text-gray-700 focus:bg-gray-100 outline-none rounded text-center opacity-30 hover:opacity-100 transition-opacity">
        </div>
    </div>

    <!-- SCREEN: QUIZ -->
    <div id="screen-quiz" class="hidden w-full h-full bg-gray-900 flex items-center justify-center">
        <!-- Main Quiz Container (Ratio handled by JS based on device) -->
        <div id="quiz-wrapper" class="quiz-container ratio-4-3 relative flex flex-col">
            
            <!-- Header -->
            <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-ruby text-white rounded-lg flex items-center justify-center font-bold">
                        IOE
                    </div>
                    <div>
                        <h2 class="font-bold text-gray-800 leading-tight">Bài Thi Thực Hành</h2>
                        <div class="text-xs text-gray-500 font-medium" id="quiz-student-info">Tên - Lớp</div>
                    </div>
                </div>
                
                <div class="flex items-center gap-6">
                    <div class="text-center">
                        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Thời gian còn lại</div>
                        <div id="timer" class="font-mono text-xl font-bold text-gray-800">30:00</div>
                    </div>
                    <button id="btn-submit-top" class="bg-ruby text-white px-6 py-2 rounded-lg font-bold hover:bg-ruby-dark transition-colors shadow-md flex items-center gap-2">
                        <i class="fas fa-paper-plane"></i> NỘP BÀI
                    </button>
                </div>
            </header>
            
            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 h-2 shrink-0">
                <div id="progress-bar" class="bg-ruby h-full transition-all duration-500 ease-out w-0"></div>
            </div>

            <!-- Body Area -->
            <div class="flex-1 flex overflow-hidden flex-col md:flex-row bg-gray-50">
                
                <!-- Left Sidebar (Navigator) -->
                <aside class="w-full md:w-64 bg-white border-r border-gray-200 flex flex-col shrink-0">
                    <div class="p-4 bg-gray-50 border-b border-gray-200">
                        <h3 class="font-bold text-sm text-gray-700 uppercase tracking-wider flex items-center justify-between">
                            Danh sách câu <span id="answered-count" class="text-ruby bg-ruby-light px-2 py-0.5 rounded-full text-xs">0/0</span>
                        </h3>
                    </div>
                    
                    <!-- Tabs for Parts -->
                    <div id="part-tabs" class="flex md:flex-col overflow-x-auto border-b md:border-b-0 border-gray-200">
                        <!-- Tabs injected via JS -->
                    </div>

                    <!-- Question Grid for Current Part -->
                    <div class="flex-1 overflow-y-auto p-4">
                        <div id="question-grid" class="grid grid-cols-5 md:grid-cols-4 gap-2">
                            <!-- Number buttons injected via JS -->
                        </div>
                    </div>
                </aside>

                <!-- Right Main Content (Question & Answers Side-by-Side) -->
                <main class="flex-1 flex flex-col h-full relative p-6 md:p-8">
                    
                    <div class="flex-1 flex flex-col lg:flex-row gap-8 overflow-y-auto">
                        <!-- Question Side -->
                        <div class="flex-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center relative">
                            <span class="absolute top-4 left-4 bg-gray-100 text-gray-500 font-bold px-3 py-1 rounded-md text-sm" id="current-q-label">Câu 1</span>
                            <div id="question-text" class="text-2xl md:text-3xl font-semibold text-gray-800 leading-snug mt-8 text-center lg:text-left">
                                <!-- Question text injected here -->
                            </div>
                        </div>
                        
                        <!-- Answers Side -->
                        <div class="flex-1 flex flex-col justify-center gap-4" id="options-container">
                            <!-- Options injected here -->
                        </div>
                    </div>

                    <!-- Bottom Controls -->
                    <div class="pt-6 mt-4 border-t border-gray-200 flex justify-between items-center shrink-0">
                        <button id="btn-prev" class="px-5 py-2.5 rounded-lg font-semibold text-gray-600 hover:bg-gray-200 transition-colors invisible">
                            <i class="fas fa-arrow-left mr-2"></i> Quay lại
                        </button>
                        <button id="btn-next" class="px-5 py-2.5 rounded-lg font-semibold bg-gray-800 text-white hover:bg-black shadow-md transition-colors">
                            Tiếp theo <i class="fas fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <!-- SCREEN: RESULT -->
    <div id="screen-result" class="hidden w-full h-full overflow-y-auto bg-gray-50 flex items-center justify-center p-4">
        <div class="bg-white max-w-3xl w-full rounded-3xl shadow-2xl overflow-hidden">
            <!-- Header Pattern -->
            <div class="bg-ruby p-8 text-center relative overflow-hidden">
                <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 20px 20px;"></div>
                <h1 class="text-4xl font-extrabold text-white relative z-10 mb-2">Hoàn thành bài thi!</h1>
                <p id="result-name-class" class="text-ruby-light font-medium relative z-10 text-lg">Họ và tên - Lớp X</p>
            </div>
            
            <div class="p-8 md:p-12">
                <div class="flex flex-col md:flex-row items-center justify-around mb-10 gap-8">
                    <!-- Score Circle -->
                    <div class="relative w-48 h-48 flex items-center justify-center">
                        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="45" fill="none" stroke="#f1f5f9" stroke-width="8"></circle>
                            <circle id="score-circle" cx="50" cy="50" r="45" fill="none" stroke="#e60000" stroke-width="8" stroke-dasharray="283" stroke-dashoffset="283" class="transition-all duration-1000 ease-out"></circle>
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                            <span id="score-percent" class="text-4xl font-black text-gray-800">0%</span>
                            <span id="score-text" class="text-sm font-semibold text-gray-500 mt-1">0 / 0 điểm</span>
                        </div>
                    </div>
                    
                    <!-- Stats Grid -->
                    <div class="grid grid-cols-2 gap-4 w-full md:w-auto">
                        <div class="bg-green-50 rounded-xl p-4 border border-green-100 text-center">
                            <div class="text-green-500 text-xl mb-1"><i class="fas fa-check-circle"></i></div>
                            <div class="text-2xl font-bold text-green-700" id="stat-correct">0</div>
                            <div class="text-xs font-semibold text-green-600 uppercase">Đúng</div>
                        </div>
                        <div class="bg-red-50 rounded-xl p-4 border border-red-100 text-center">
                            <div class="text-red-500 text-xl mb-1"><i class="fas fa-times-circle"></i></div>
                            <div class="text-2xl font-bold text-red-700" id="stat-wrong">0</div>
                            <div class="text-xs font-semibold text-red-600 uppercase">Sai</div>
                        </div>
                        <div class="bg-blue-50 rounded-xl p-4 border border-blue-100 text-center col-span-2">
                            <div class="text-blue-500 text-xl mb-1"><i class="fas fa-clock"></i></div>
                            <div class="text-2xl font-bold text-blue-700" id="stat-time">00:00</div>
                            <div class="text-xs font-semibold text-blue-600 uppercase">Tổng thời gian</div>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex flex-col sm:flex-row gap-4 justify-center mt-8">
                    <button id="btn-review" class="flex-1 py-4 px-6 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold rounded-xl transition-colors flex items-center justify-center gap-2 border border-gray-200">
                        <i class="fas fa-list-check"></i> Xem lại đáp án
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCREEN: REVIEW -->
    <div id="screen-review" class="hidden w-full h-full overflow-hidden bg-gray-100 flex flex-col">
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shrink-0 shadow-sm z-10">
            <div class="flex items-center gap-3">
                <button id="btn-back-result" class="w-10 h-10 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-full flex items-center justify-center transition-colors">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h2 class="font-bold text-gray-800 text-xl">Xem lại đáp án</h2>
            </div>
            <div class="text-ruby font-bold">ÔN THI IOE</div>
        </header>
        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <div class="max-w-4xl mx-auto space-y-6" id="review-container">
                <!-- Review cards injected here -->
            </div>
        </main>
    </div>

    <script>
        // --- STREAMING_CHUNK:Quản lý Biến Trạng Thái ---
        let appState = {
            studentName: '',
            grade: '',
            examRoundText: '',
            targetCount: 0,
            isTeacher: false,
            deviceType: 'laptop', // Default setting
            
            questions: [],
            answers: {}, // { questionId: selectedOption }
            currentQuestionIndex: 0,
            currentTab: 0, // grouping 5 questions per tab
            
            startTime: null,
            timerInterval: null,
            timeLeft: 1800, // 30 minutes in seconds
            
            cheatWarnings: 0,
            isTesting: false,
            retryMode: false // true if user is re-doing wrong answers
        };

        const POINTS_PER_QUESTION = 10;
        const QUESTIONS_PER_TAB = 5;

        // --- STREAMING_CHUNK:Utility Functions & Modals ---
        
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        const modal = {
            show: (title, desc, buttons, icon = 'fa-exclamation-circle', iconColor = 'text-ruby') => {
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-desc').innerHTML = desc;
                
                const iconEl = document.getElementById('modal-icon');
                iconEl.className = `text-5xl mb-4 ${iconColor}`;
                iconEl.innerHTML = `<i class="fas ${icon}"></i>`;
                
                const actionsEl = document.getElementById('modal-actions');
                actionsEl.innerHTML = '';
                
                buttons.forEach(btn => {
                    const b = document.createElement('button');
                    b.className = `flex-1 py-3 px-4 rounded-xl font-bold transition-all transform active:scale-95 ${btn.class}`;
                    b.textContent = btn.text;
                    b.onclick = () => {
                        if(btn.onClick) btn.onClick();
                        if(btn.close !== false) modal.hide();
                    };
                    actionsEl.appendChild(b);
                });
                
                document.getElementById('global-modal').classList.remove('hidden');
            },
            hide: () => {
                document.getElementById('global-modal').classList.add('hidden');
            }
        };

        // Screen Navigation
        function showScreen(screenId) {
            ['screen-start', 'screen-quiz', 'screen-result', 'screen-review'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        // --- STREAMING_CHUNK:App Initialization & Start Logic ---
        
        document.getElementById('test-mode').addEventListener('change', (e) => {
            const countInput = document.getElementById('question-count');
            // Nếu học sinh chọn 1 Dạng bài thay vì Full test
            if (e.target.value.startsWith('dang')) {
                countInput.classList.remove('hidden');
                countInput.required = true;
            } else {
                countInput.classList.add('hidden');
                countInput.required = false;
                countInput.value = '';
            }
        });

        document.getElementById('teacher-key').addEventListener('input', (e) => {
            if (e.target.value === '968903') {
                appState.isTeacher = true;
                e.target.style.backgroundColor = '#dcfce7'; // green success
                modal.show('Thành công', 'Đã xác nhận tài khoản Giáo viên. Bạn có thể nộp bài bất cứ lúc nào.', [{text: 'Đóng', class: 'bg-green-500 text-white'}], 'fa-check-circle', 'text-green-500');
                setTimeout(() => e.target.value = '', 1500);
            }
        });

        // --- STREAMING_CHUNK:Tải dữ liệu từ File JSON ---
        
        // Thuật toán xáo trộn mảng Fisher-Yates để đảm bảo tính ngẫu nhiên 100%
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function fetchQuestions(fileName, count) {
            try {
                modal.show('Đang tải dữ liệu...', 'Vui lòng chờ trong giây lát...', [], 'fa-spinner fa-spin', 'text-blue-500');
                
                const fetchUrl = `./${fileName}`; 
                const response = await fetch(fetchUrl);
                
                if (!response.ok) {
                    throw new Error(`Không tìm thấy file: <b>${fileName}</b>.<br><br>Hãy kiểm tra lại tên file trên Github.`);
                }
                
                let rawData = await response.json();
                modal.hide();

                let processedData = [];

                if (rawData.part_A) {
                    rawData.part_A.forEach(item => {
                        let optsArray = [];
                        if (typeof item.options === 'string') {
                            optsArray = item.options.split(/,\s*(?=[A-D]\.)/);
                        } else {
                            optsArray = item.options;
                        }

                        processedData.push({
                            q: item.question,
                            opts: optsArray,
                            ans: item.answer,
                            exp: "Không có giải thích chi tiết."
                        });
                    });
                } else {
                    processedData = rawData;
                }

                processedData = shuffleArray(processedData);

                if (count && count > 0) {
                    processedData = processedData.slice(0, count);
                }

                return processedData.map((item, index) => {
                    let finalOpts = item.opts ? shuffleArray([...item.opts]) : [];
                    return {
                        id: index + 1,
                        text: item.q,
                        options: finalOpts,
                        correct: item.ans,
                        explanation: item.exp,
                        part: Math.floor(index / QUESTIONS_PER_TAB) + 1
                    };
                });
            } catch (error) {
                console.error("Error loading JSON:", error);
                modal.hide();
                modal.show(
                    'Lỗi tải dữ liệu đề thi', 
                    `<div class="text-left bg-red-50 p-3 rounded-lg border border-red-200 mt-2 text-sm text-red-700">${error.message}</div>`, 
                    [{text: 'Đóng', class: 'bg-ruby text-white'}]
                );
                return null;
            }
        }

        document.getElementById('start-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const passcode = document.getElementById('passcode').value;
            if (passcode !== '1235' && !appState.isTeacher) {
                modal.show('Sai mã xác nhận', 'Vui lòng nhập đúng mã xác nhận để bắt đầu làm bài.', [{text: 'Đồng ý', class: 'bg-ruby text-white'}]);
                return;
            }
            
            appState.studentName = document.getElementById('student-name').value;
            appState.grade = document.getElementById('student-grade').value;
            const examRoundValue = document.getElementById('exam-round').value; // Lấy Vòng Thi (1, 2, 3, 4)
            
            const roundNames = ["Trường", "Quận/Huyện", "Thành Phố", "Quốc Gia"];
            appState.examRoundText = roundNames[examRoundValue - 1] || "";
            
            const testMode = document.getElementById('test-mode').value;
            let fileName = '';
            
            // ==========================================
            // LOGIC CHẮP NỐI TÊN FILE JSON CHÍNH XÁC NHẤT
            // ==========================================
            if (testMode.startsWith('full')) {
                // CHUYÊN ĐỀ: Ví dụ "Lớp 3 - Vòng 1 - Chuyên đề 2" sẽ ra tên file là: json3.vong1.2.json
                const topic = testMode.split('-')[1]; 
                fileName = `json${appState.grade}.vong${examRoundValue}.${topic}.json`;
                appState.targetCount = null; // Full test thì lấy hết
            } else if (testMode.startsWith('dang')) {
                // DẠNG BÀI: Ví dụ "Lớp 9 - Vòng 4 - Dạng 3" sẽ ra tên file là: json9.vong4.dang3.json
                const typeNumber = testMode.split('-')[1];
                fileName = `json${appState.grade}.vong${examRoundValue}.dang${typeNumber}.json`;
                
                appState.targetCount = parseInt(document.getElementById('question-count').value);
                if (appState.targetCount > 199) appState.targetCount = 199;
            }
            
            // Gọi API đọc file JSON tương ứng với tên vừa tạo
            const fetchedQuestions = await fetchQuestions(fileName, appState.targetCount);
            
            if (!fetchedQuestions || fetchedQuestions.length === 0) return;

            appState.questions = fetchedQuestions;
            appState.answers = {};
            appState.currentQuestionIndex = 0;
            appState.cheatWarnings = 0;
            appState.retryMode = false;
            
            // Bắt đầu làm bài
            initQuizEnvironment('laptop');
        });

        function initQuizEnvironment(device) {
            appState.deviceType = device;
            const wrapper = document.getElementById('quiz-wrapper');
            
            // Giao diện tự động mở rộng ratio-4-3 ra fullscreen khi vào bài
            wrapper.classList.add('ratio-4-3');
            wrapper.classList.remove('ratio-tablet');

            // Setup UI
            document.getElementById('quiz-student-info').textContent = `${appState.studentName} - Lớp ${appState.grade} (Vòng ${appState.examRoundText})`;
            
            // Render Nav & Initial Question
            renderNavigation();
            loadQuestion(0);
            
            // Start State
            appState.isTesting = true;
            appState.timeLeft = 1800; // Đếm ngược 30 phút (1800 giây)
            startTimer();
            
            // Request Fullscreen tự động
            try {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => console.log("Fullscreen blocked"));
                }
            } catch(e){}

            showScreen('screen-quiz');
        }

        // --- STREAMING_CHUNK:Quiz Engine & Rendering ---

        function startTimer() {
            clearInterval(appState.timerInterval);
            document.getElementById('timer').textContent = formatTime(appState.timeLeft);
            appState.timerInterval = setInterval(() => {
                appState.timeLeft--;
                document.getElementById('timer').textContent = formatTime(appState.timeLeft);
                
                if (appState.timeLeft <= 0) {
                    clearInterval(appState.timerInterval);
                    appState.isTesting = false; // Prevent anti-cheat from triggering
                    modal.show(
                        'Hết giờ!',
                        'Đã hết thời gian 30 phút! Bài làm của bạn sẽ tự động được nộp.',
                        [{ text: 'Xem Kết Quả', class: 'bg-ruby text-white', onClick: processResult }],
                        'fa-clock',
                        'text-red-500'
                    );
                }
            }, 1000);
        }

        function updateProgress() {
            const answered = Object.keys(appState.answers).length;
            const total = appState.questions.length;
            const percent = (answered / total) * 100;
            
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('answered-count').textContent = `${answered}/${total}`;
            
            // Update grid colors
            appState.questions.forEach((q, idx) => {
                const btn = document.getElementById(`nav-btn-${idx}`);
                if (btn) {
                    if (appState.answers[q.id]) {
                        btn.classList.remove('bg-gray-100', 'text-gray-600', 'border-gray-200');
                        btn.classList.add('bg-ruby', 'text-white', 'border-ruby');
                    }
                }
            });
        }

        function renderNavigation() {
            // Group by parts
            const numParts = Math.ceil(appState.questions.length / QUESTIONS_PER_TAB);
            const tabsContainer = document.getElementById('part-tabs');
            tabsContainer.innerHTML = '';
            
            for (let i = 1; i <= numParts; i++) {
                const btn = document.createElement('button');
                btn.className = `tab-btn px-4 py-3 text-sm font-medium text-gray-500 whitespace-nowrap md:w-full md:text-left transition-colors hover:bg-gray-100 ${i === 1 ? 'active' : ''}`;
                btn.textContent = `Phần ${i}`;
                btn.onclick = (e) => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    renderGridForPart(i);
                };
                tabsContainer.appendChild(btn);
            }
            
            renderGridForPart(1);
        }

        function renderGridForPart(partNum) {
            const grid = document.getElementById('question-grid');
            grid.innerHTML = '';
            
            appState.questions.forEach((q, index) => {
                if (q.part === partNum) {
                    const btn = document.createElement('button');
                    btn.id = `nav-btn-${index}`;
                    
                    let classes = 'w-10 h-10 rounded-lg flex items-center justify-center font-bold text-sm transition-all border shadow-sm ';
                    if (appState.answers[q.id]) {
                        classes += 'bg-ruby text-white border-ruby ';
                    } else {
                        classes += 'bg-white text-gray-600 border-gray-200 hover:border-ruby hover:text-ruby ';
                    }
                    if (index === appState.currentQuestionIndex) {
                        classes += 'ring-2 ring-ruby ring-offset-2 ';
                    }
                    
                    btn.className = classes;
                    btn.textContent = index + 1;
                    btn.onclick = () => loadQuestion(index);
                    grid.appendChild(btn);
                }
            });
        }

        function loadQuestion(index) {
            appState.currentQuestionIndex = index;
            const q = appState.questions[index];
            
            // Sync Tab Active state
            const targetPart = q.part;
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach((t, i) => {
                if (i + 1 === targetPart) {
                    if(!t.classList.contains('active')){
                        t.click(); // switch tab visually
                    }
                }
            });
            
            // Render Grid Highlight
            document.querySelectorAll('#question-grid button').forEach(b => b.classList.remove('ring-2', 'ring-ruby', 'ring-offset-2'));
            const activeBtn = document.getElementById(`nav-btn-${index}`);
            if (activeBtn) activeBtn.classList.add('ring-2', 'ring-ruby', 'ring-offset-2');

            // Render Content
            document.getElementById('current-q-label').textContent = `Câu ${index + 1}`;
            document.getElementById('question-text').innerHTML = q.text;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                const isSelected = appState.answers[q.id] === opt;
                
                btn.className = `w-full text-left p-5 md:p-6 rounded-xl border-2 transition-all transform active:scale-[0.98] text-lg font-medium shadow-sm flex items-center justify-between group ${isSelected ? 'border-ruby bg-ruby-light/40 text-ruby-dark' : 'border-gray-200 bg-white hover:border-ruby/50 text-gray-700 hover:bg-gray-50'}`;
                
                btn.innerHTML = `
                    <span>${opt}</span>
                    <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center ${isSelected ? 'border-ruby bg-ruby' : 'border-gray-300 group-hover:border-ruby/50'}">
                        ${isSelected ? '<i class="fas fa-check text-white text-xs"></i>' : ''}
                    </div>
                `;
                
                btn.onclick = () => {
                    appState.answers[q.id] = opt;
                    loadQuestion(index); // re-render options and progress
                };
                
                optionsContainer.appendChild(btn);
            });

            // Footer Buttons
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            
            if (index === 0) {
                btnPrev.classList.add('invisible');
            } else {
                btnPrev.classList.remove('invisible');
                btnPrev.onclick = () => loadQuestion(index - 1);
            }
            
            if (index === appState.questions.length - 1) {
                btnNext.innerHTML = `<i class="fas fa-check-circle mr-2"></i> Hoàn thành`;
                btnNext.className = "px-5 py-2.5 rounded-lg font-semibold bg-ruby text-white hover:bg-ruby-dark shadow-md transition-colors";
                btnNext.onclick = handleSubmit;
            } else {
                btnNext.innerHTML = `Tiếp theo <i class="fas fa-arrow-right ml-2"></i>`;
                btnNext.className = "px-5 py-2.5 rounded-lg font-semibold bg-gray-800 text-white hover:bg-black shadow-md transition-colors";
                btnNext.onclick = () => loadQuestion(index + 1);
            }
            
            updateProgress();
        }

        // --- STREAMING_CHUNK:Submission & Anti-Cheat Logic ---

        document.getElementById('btn-submit-top').addEventListener('click', handleSubmit);

        function handleSubmit() {
            const answered = Object.keys(appState.answers).length;
            const total = appState.questions.length;
            
            if (appState.isTeacher) {
                processResult();
                return;
            }
            
            if (answered < total) {
                modal.show(
                    'Chưa hoàn thành',
                    `Bạn mới làm <b>${answered}</b> trên tổng số <b>${total}</b> câu hỏi.<br><br>Bạn có chắc chắn muốn nộp bài không?`,
                    [
                        { text: 'Hủy', class: 'bg-gray-200 text-gray-800 hover:bg-gray-300' },
                        { text: 'Nộp bài', class: 'bg-ruby text-white hover:bg-ruby-dark', onClick: processResult }
                    ],
                    'fa-question-circle',
                    'text-yellow-500'
                );
            } else {
                processResult();
            }
        }

        // Anti-Cheat (Giới hạn thoát màn hình 3 lần)
        document.addEventListener('visibilitychange', () => {
            if (!appState.isTesting || appState.isTeacher) return;
            
            if (document.visibilityState === 'hidden') {
                appState.cheatWarnings++;
                if (appState.cheatWarnings >= 3) {
                    modal.show(
                        'Thu bài tự động',
                        'Bạn đã thoát khỏi màn hình làm bài quá nhiều lần. Bài thi của bạn đã tự động được nộp.',
                        [{ text: 'Xem kết quả', class: 'bg-ruby text-white', onClick: processResult }],
                        'fa-ban',
                        'text-red-600'
                    );
                } else {
                    modal.show(
                        'Cảnh báo!',
                        `Vui lòng không thoát khỏi màn hình làm bài. Cảnh báo lần ${appState.cheatWarnings}/3.<br><br><span class="text-sm text-gray-500">Nếu vi phạm quá 3 lần, bài sẽ tự động nộp.</span>`,
                        [{ text: 'Đã hiểu', class: 'bg-ruby text-white' }],
                        'fa-triangle-exclamation',
                        'text-yellow-500'
                    );
                }
            }
        });

        // --- STREAMING_CHUNK:Result Processing & Review ---

        function processResult() {
            appState.isTesting = false;
            clearInterval(appState.timerInterval);
            
            // Thoát chế độ toàn màn hình an toàn
            try {
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(()=>{});
                }
            } catch(e) {}
            
            let correctCount = 0;
            appState.questions.forEach(q => {
                if (appState.answers[q.id] === q.correct) correctCount++;
            });
            
            const total = appState.questions.length;
            const percentage = (correctCount / total) * 100;
            const totalScore = correctCount * POINTS_PER_QUESTION;
            
            // Điền thông tin vào màn hình kết quả
            document.getElementById('result-name-class').textContent = `${appState.studentName} - Lớp ${appState.grade} (Vòng ${appState.examRoundText})`;
            document.getElementById('score-percent').textContent = `${Math.round(percentage)}%`;
            document.getElementById('score-text').textContent = `${totalScore} / ${total * POINTS_PER_QUESTION} điểm`;
            
            document.getElementById('stat-correct').textContent = correctCount;
            document.getElementById('stat-wrong').textContent = total - correctCount;
            
            const timeSpent = Math.max(0, 1800 - appState.timeLeft);
            document.getElementById('stat-time').textContent = formatTime(timeSpent);
            
            // Chạy hiệu ứng vòng tròn điểm số
            setTimeout(() => {
                const offset = 283 - (283 * percentage) / 100;
                document.getElementById('score-circle').style.strokeDashoffset = offset;
            }, 100);

            showScreen('screen-result');
            
            // Logic cho học sinh làm lại nếu đạt trên 85%
            if (percentage >= 85 && percentage < 100 && !appState.retryMode) {
                setTimeout(() => {
                    modal.show(
                        'Làm rất tốt!',
                        'Bạn đã đạt trên 85%! Bạn có muốn làm lại các câu bị sai để đạt điểm tối đa không?',
                        [
                            { text: 'Bỏ qua', class: 'bg-gray-200 text-gray-800' },
                            { text: 'Làm lại câu sai', class: 'bg-ruby text-white', onClick: setupRetry }
                        ],
                        'fa-star',
                        'text-yellow-400'
                    );
                }, 1000);
            }
        }

        function setupRetry() {
            // Chỉ lọc lại những câu trả lời sai
            const wrongQuestions = appState.questions.filter(q => appState.answers[q.id] !== q.correct);
            
            // Đặt lại các phần chia Tab
            wrongQuestions.forEach((q, idx) => {
                q.part = Math.floor(idx / QUESTIONS_PER_TAB) + 1;
            });
            
            appState.questions = wrongQuestions;
            appState.answers = {};
            appState.retryMode = true;
            appState.currentQuestionIndex = 0;
            
            initQuizEnvironment(appState.deviceType);
        }

        document.getElementById('btn-review').addEventListener('click', () => {
            const container = document.getElementById('review-container');
            container.innerHTML = '';
            
            appState.questions.forEach((q, idx) => {
                const studentAns = appState.answers[q.id];
                const isCorrect = studentAns === q.correct;
                
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-2xl shadow-sm border border-gray-200";
                
                let optionsHTML = '';
                q.options.forEach(opt => {
                    let optClass = "p-3 rounded-lg border mb-2 text-sm ";
                    let icon = "";
                    
                    if (opt === q.correct) {
                        optClass += "bg-green-50 border-green-500 text-green-700 font-bold";
                        icon = "<i class='fas fa-check-circle float-right text-green-500 mt-0.5'></i>";
                    } else if (opt === studentAns && !isCorrect) {
                        optClass += "bg-red-50 border-red-500 text-red-700";
                        icon = "<i class='fas fa-times-circle float-right text-red-500 mt-0.5'></i>";
                    } else {
                        optClass += "bg-gray-50 border-gray-200 text-gray-600";
                    }
                    
                    optionsHTML += `<div class="${optClass}">${opt} ${icon}</div>`;
                });
                
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4 border-b pb-4">
                        <div class="font-bold text-gray-800 text-lg flex-1 mr-4">
                            <span class="text-gray-400 mr-2">Câu ${idx+1}.</span> ${q.text}
                        </div>
                        <div class="px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap ${isCorrect ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                            ${isCorrect ? '+10 Điểm' : '0 Điểm'}
                        </div>
                    </div>
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <h4 class="text-xs font-bold text-gray-400 uppercase mb-2">Các đáp án</h4>
                            ${optionsHTML}
                        </div>
                        <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100 h-fit">
                            <h4 class="text-xs font-bold text-blue-500 uppercase mb-2 flex items-center gap-1"><i class="fas fa-lightbulb"></i> Giải thích</h4>
                            <p class="text-sm text-gray-700 leading-relaxed">${q.explanation}</p>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            
            showScreen('screen-review');
        });

        document.getElementById('btn-back-result').addEventListener('click', () => {
            showScreen('screen-result');
        });

    </script>
</body>
</html>
