<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ÔN THI IOE - Ruby School</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruby: {
                            light: '#ffe5e5',
                            DEFAULT: '#e60000',
                            dark: '#b30000',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8f9fa; color: #333; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #e60000; }
        .hidden { display: none !important; }

        /* Sidebar slide-in on mobile */
        #sidebar-panel {
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }
        #sidebar-panel.open {
            transform: translateX(0);
        }
        #sidebar-overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #sidebar-overlay.open {
            opacity: 1;
            pointer-events: all;
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center relative">

    <!-- Modal -->
    <div id="global-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(0,0,0,0.6);backdrop-filter:blur(4px)">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 flex flex-col items-center text-center">
            <div id="modal-icon" class="text-5xl mb-4 text-ruby"><i class="fas fa-exclamation-circle"></i></div>
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-2">Tiêu đề</h3>
            <p id="modal-desc" class="text-gray-600 mb-6 text-sm">Nội dung.</p>
            <div id="modal-actions" class="flex gap-3 w-full justify-center"></div>
        </div>
    </div>

    <!-- ===== SCREEN: START ===== -->
    <div id="screen-start" class="w-full min-h-screen flex items-center justify-center bg-red-50/40 p-4">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-6 sm:p-10 border-t-8 border-ruby relative">
            <div class="text-center mb-6">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-ruby text-white rounded-full flex items-center justify-center mx-auto mb-3 text-2xl sm:text-3xl shadow-lg shadow-ruby/40">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800 tracking-tight">ÔN THI IOE</h1>
                <p class="text-ruby font-semibold mt-1 text-sm">Ruby School</p>
            </div>

            <form id="start-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Họ và Tên</label>
                    <input type="text" id="student-name" required placeholder="Nhập họ và tên của bạn"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-ruby focus:border-ruby outline-none transition-all text-base">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Chọn Lớp</label>
                        <select id="student-grade" required
                            class="w-full px-3 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-ruby focus:border-ruby outline-none transition-all bg-white text-sm">
                            <option value="" disabled selected>Chọn Lớp...</option>
                            <option value="3">Lớp 3</option>
                            <option value="4">Lớp 4</option>
                            <option value="5">Lớp 5</option>
                            <option value="6">Lớp 6</option>
                            <option value="7">Lớp 7</option>
                            <option value="8">Lớp 8</option>
                            <option value="9">Lớp 9</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Vòng Thi</label>
                        <select id="exam-round" required
                            class="w-full px-3 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-ruby focus:border-ruby outline-none transition-all bg-white text-sm">
                            <option value="" disabled selected>Chọn Vòng...</option>
                            <option value="1">1. Vòng Trường</option>
                            <option value="2">2. Vòng Quận/Huyện</option>
                            <option value="3">3. Vòng Thành Phố</option>
                            <option value="4">4. Vòng Quốc Gia</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Chuyên đề</label>
                        <select id="test-mode"
                            class="w-full px-3 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-ruby focus:border-ruby outline-none transition-all bg-white text-sm">
                            <option value="full-1">Chuyên đề 1</option>
                            <option value="full-2">Chuyên đề 2</option>
                            <option value="full-3">Chuyên đề 3</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Mã xác nhận</label>
                    <input type="password" id="passcode" required placeholder="Nhập mã xác nhận"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-ruby focus:border-ruby outline-none transition-all text-base">
                </div>

                <button type="submit"
                    class="w-full bg-ruby hover:bg-ruby-dark active:scale-95 text-white font-bold py-4 rounded-xl shadow-lg transition-all text-base mt-2">
                    BẮT ĐẦU LÀM BÀI <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </form>

            <input type="password" id="teacher-key" placeholder="Key GV"
                class="absolute bottom-2 right-2 w-14 text-[9px] p-1 border-none bg-transparent text-gray-300 focus:text-gray-700 focus:bg-gray-100 outline-none rounded text-center opacity-20 hover:opacity-100 transition-opacity">
        </div>
    </div>

    <!-- ===== SCREEN: QUIZ ===== -->
    <div id="screen-quiz" class="hidden fixed inset-0 bg-white flex flex-col">

        <!-- Header -->
        <header class="bg-white border-b border-gray-200 px-3 sm:px-6 py-3 flex justify-between items-center shrink-0 z-20">
            <div class="flex items-center gap-2 sm:gap-3 min-w-0">
                <!-- Sidebar toggle (mobile only) -->
                <button id="btn-sidebar-toggle"
                    class="md:hidden w-9 h-9 bg-gray-100 text-gray-600 rounded-lg flex items-center justify-center shrink-0">
                    <i class="fas fa-list-ol text-sm"></i>
                </button>
                <div class="w-9 h-9 sm:w-10 sm:h-10 bg-ruby text-white rounded-lg flex items-center justify-center font-bold text-sm shrink-0">
                    IOE
                </div>
                <div class="min-w-0 hidden sm:block">
                    <div class="font-bold text-gray-800 text-sm leading-tight">Bài Thi Thực Hành</div>
                    <div class="text-xs text-gray-500 truncate max-w-[180px]" id="quiz-student-info">Tên - Lớp</div>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-4">
                <div class="text-center">
                    <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wide hidden sm:block">Thời gian</div>
                    <div id="timer" class="font-mono text-lg sm:text-xl font-bold text-gray-800">00:00</div>
                </div>
                <!-- Answered count (mobile) -->
                <div id="answered-count-mobile" class="text-xs font-bold text-gray-500 sm:hidden">0/0</div>
                <button id="btn-submit-top"
                    class="bg-ruby text-white px-3 sm:px-5 py-2 rounded-lg font-bold hover:bg-ruby-dark transition-colors shadow-md flex items-center gap-1.5 text-sm">
                    <i class="fas fa-paper-plane text-xs sm:text-sm"></i>
                    <span class="hidden xs:inline">NỘP BÀI</span>
                    <span class="xs:hidden">NỘP</span>
                </button>
            </div>
        </header>

        <!-- Progress Bar -->
        <div class="w-full bg-gray-200 h-1.5 shrink-0">
            <div id="progress-bar" class="bg-ruby h-full transition-all duration-500 ease-out w-0"></div>
        </div>

        <!-- Body -->
        <div class="flex-1 flex overflow-hidden bg-gray-50 relative">

            <!-- Sidebar Overlay (mobile) -->
            <div id="sidebar-overlay" class="fixed inset-0 z-30 md:hidden" style="background:rgba(0,0,0,0.4)"
                onclick="closeSidebar()"></div>

            <!-- Sidebar Panel -->
            <aside id="sidebar-panel"
                class="fixed md:static top-0 left-0 h-full w-64 bg-white border-r border-gray-200 flex flex-col z-40 md:transform-none md:translate-x-0 shrink-0">
                <div class="p-3 bg-gray-50 border-b border-gray-200 flex items-center justify-between">
                    <h3 class="font-bold text-xs text-gray-700 uppercase tracking-wider">
                        Câu hỏi <span id="answered-count" class="text-ruby bg-ruby-light px-2 py-0.5 rounded-full">0/0</span>
                    </h3>
                    <button class="md:hidden text-gray-400 hover:text-gray-600" onclick="closeSidebar()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="flex-1 overflow-y-auto p-3">
                    <div id="question-grid" class="grid grid-cols-5 gap-1.5">
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="flex-1 flex flex-col overflow-hidden">
                <div class="flex-1 overflow-y-auto p-3 sm:p-6">
                    <div class="max-w-2xl mx-auto flex flex-col gap-4 h-full">

                        <!-- Question Card -->
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 sm:p-6 relative">
                            <div class="flex items-center gap-2 mb-3">
                                <span class="bg-ruby text-white font-bold px-3 py-1 rounded-lg text-sm" id="current-q-label">Câu 1</span>
                                <span class="text-gray-400 text-sm" id="total-q-label">/ 0</span>
                            </div>
                            <div id="question-text"
                                class="text-lg sm:text-2xl font-semibold text-gray-800 leading-snug">
                            </div>
                        </div>

                        <!-- Options -->
                        <div class="flex flex-col gap-2.5 sm:gap-3" id="options-container">
                        </div>

                    </div>
                </div>

                <!-- Bottom Controls -->
                <div class="border-t border-gray-200 bg-white px-4 py-3 flex justify-between items-center shrink-0">
                    <button id="btn-prev"
                        class="px-4 py-2.5 rounded-lg font-semibold text-gray-600 hover:bg-gray-100 transition-colors text-sm flex items-center gap-1.5 invisible">
                        <i class="fas fa-arrow-left"></i> Quay lại
                    </button>
                    <button id="btn-next"
                        class="px-5 py-2.5 rounded-lg font-semibold bg-gray-800 text-white hover:bg-black shadow-md transition-colors text-sm flex items-center gap-1.5">
                        Tiếp theo <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </main>
        </div>
    </div>

    <!-- ===== SCREEN: RESULT ===== -->
    <div id="screen-result" class="hidden fixed inset-0 overflow-y-auto bg-gray-50 flex items-start justify-center p-4 pt-6">
        <div class="bg-white max-w-lg w-full rounded-3xl shadow-2xl overflow-hidden mb-6">
            <div class="bg-ruby p-6 sm:p-8 text-center relative overflow-hidden">
                <div class="absolute inset-0 opacity-10" style="background-image:radial-gradient(circle at 2px 2px,white 1px,transparent 0);background-size:20px 20px"></div>
                <h1 class="text-3xl sm:text-4xl font-extrabold text-white relative z-10 mb-1">Hoàn thành!</h1>
                <p id="result-name-class" class="text-red-200 font-medium relative z-10 text-sm sm:text-base">Họ tên - Lớp</p>
            </div>

            <div class="p-6 sm:p-10">
                <div class="flex flex-col sm:flex-row items-center justify-around mb-8 gap-6">
                    <div class="relative w-36 h-36 sm:w-44 sm:h-44 flex items-center justify-center shrink-0">
                        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="45" fill="none" stroke="#f1f5f9" stroke-width="8"></circle>
                            <circle id="score-circle" cx="50" cy="50" r="45" fill="none" stroke="#e60000" stroke-width="8"
                                stroke-dasharray="283" stroke-dashoffset="283" class="transition-all duration-1000 ease-out"></circle>
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                            <span id="score-percent" class="text-3xl font-black text-gray-800">0%</span>
                            <span id="score-text" class="text-xs font-semibold text-gray-500 mt-0.5">0 / 0 điểm</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 sm:grid-cols-1 gap-3 w-full sm:w-auto">
                        <div class="bg-green-50 rounded-xl p-3 border border-green-100 text-center">
                            <div class="text-green-500 text-lg mb-0.5"><i class="fas fa-check-circle"></i></div>
                            <div class="text-2xl font-bold text-green-700" id="stat-correct">0</div>
                            <div class="text-xs font-semibold text-green-600 uppercase">Đúng</div>
                        </div>
                        <div class="bg-red-50 rounded-xl p-3 border border-red-100 text-center">
                            <div class="text-red-500 text-lg mb-0.5"><i class="fas fa-times-circle"></i></div>
                            <div class="text-2xl font-bold text-red-700" id="stat-wrong">0</div>
                            <div class="text-xs font-semibold text-red-600 uppercase">Sai</div>
                        </div>
                        <div class="bg-blue-50 rounded-xl p-3 border border-blue-100 text-center">
                            <div class="text-blue-500 text-lg mb-0.5"><i class="fas fa-clock"></i></div>
                            <div class="text-xl font-bold text-blue-700" id="stat-time">00:00</div>
                            <div class="text-xs font-semibold text-blue-600 uppercase">Thời gian</div>
                        </div>
                    </div>
                </div>

                <div class="flex gap-3 justify-center">
                    <button id="btn-review"
                        class="flex-1 py-3.5 px-4 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold rounded-xl transition-colors flex items-center justify-center gap-2 border border-gray-200 text-sm">
                        <i class="fas fa-list-check"></i> Xem lại đáp án
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== SCREEN: REVIEW ===== -->
    <div id="screen-review" class="hidden fixed inset-0 bg-gray-100 flex flex-col overflow-hidden">
        <header class="bg-white border-b border-gray-200 px-4 py-3 flex justify-between items-center shrink-0 shadow-sm z-10">
            <div class="flex items-center gap-3">
                <button id="btn-back-result"
                    class="w-9 h-9 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-full flex items-center justify-center transition-colors">
                    <i class="fas fa-arrow-left text-sm"></i>
                </button>
                <h2 class="font-bold text-gray-800 text-base sm:text-xl">Xem lại đáp án</h2>
            </div>
            <div class="text-ruby font-bold text-sm">ÔN THI IOE</div>
        </header>
        <main class="flex-1 overflow-y-auto p-3 sm:p-6">
            <div class="max-w-3xl mx-auto space-y-4" id="review-container"></div>
        </main>
    </div>

    <script>
        let appState = {
            studentName: '', grade: '', examRoundText: '',
            isTeacher: false,
            questions: [],
            answers: {},
            currentQuestionIndex: 0,
            startTime: null,
            timerInterval: null,
            timeElapsed: 0,
            retryMode: false
        };

        const POINTS_PER_QUESTION = 10;

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function formatTime(s) {
            return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
        }

        // --- Sidebar (mobile) ---
        function openSidebar() {
            document.getElementById('sidebar-panel').classList.add('open');
            document.getElementById('sidebar-overlay').classList.add('open');
        }
        function closeSidebar() {
            document.getElementById('sidebar-panel').classList.remove('open');
            document.getElementById('sidebar-overlay').classList.remove('open');
        }
        document.getElementById('btn-sidebar-toggle').onclick = openSidebar;

        // --- Modal ---
        const modal = {
            show(title, desc, buttons, icon='fa-exclamation-circle', iconColor='text-ruby') {
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-desc').innerHTML = desc;
                const iconEl = document.getElementById('modal-icon');
                iconEl.className = `text-5xl mb-4 ${iconColor}`;
                iconEl.innerHTML = `<i class="fas ${icon}"></i>`;
                const actionsEl = document.getElementById('modal-actions');
                actionsEl.innerHTML = '';
                buttons.forEach(btn => {
                    const b = document.createElement('button');
                    b.className = `flex-1 py-3 px-3 rounded-xl font-bold transition-all active:scale-95 text-sm ${btn.class}`;
                    b.textContent = btn.text;
                    b.onclick = () => { if(btn.onClick) btn.onClick(); if(btn.close!==false) modal.hide(); };
                    actionsEl.appendChild(b);
                });
                document.getElementById('global-modal').classList.remove('hidden');
            },
            hide() { document.getElementById('global-modal').classList.add('hidden'); }
        };

        function showScreen(id) {
            ['screen-start','screen-quiz','screen-result','screen-review'].forEach(s => {
                document.getElementById(s).classList.add('hidden');
            });
            document.getElementById(id).classList.remove('hidden');
            window.scrollTo(0,0);
        }

        // --- Teacher key ---
        document.getElementById('teacher-key').addEventListener('input', e => {
            if (e.target.value === '968903') {
                appState.isTeacher = true;
                e.target.style.backgroundColor = '#dcfce7';
                modal.show('Thành công','Đã xác nhận Giáo viên.',[{text:'Đóng',class:'bg-green-500 text-white'}],'fa-check-circle','text-green-500');
                setTimeout(()=>e.target.value='', 1500);
            }
        });

        // --- Shuffle ---
        function shuffleArray(arr) {
            for (let i=arr.length-1;i>0;i--) {
                const j=Math.floor(Math.random()*(i+1));
                [arr[i],arr[j]]=[arr[j],arr[i]];
            }
            return arr;
        }

        // --- Fetch questions ---
        async function fetchQuestions(fileName, count) {
            try {
                modal.show('Đang tải...','Vui lòng chờ...',[],'fa-spinner fa-spin','text-blue-500');
                const res = await fetch(`./${fileName}`);
                if (!res.ok) throw new Error(`Không tìm thấy file: <b>${fileName}</b>`);
                const raw = await res.json();
                modal.hide();

                let data = [];
                const processPart = part => {
                    if (!part) return;
                    part.forEach(item => {
                        let opts = [];
                        if (item.options) {
                            opts = typeof item.options==='string'
                                ? item.options.split(/,\s*(?=[A-D]\.)/)
                                : item.options;
                        }
                        data.push({ q: item.question||item.q, opts, ans: item.answer||item.ans, exp: item.explanation||item.exp||'' });
                    });
                };
                if (raw.part_A||raw.part_B||raw.part_C) {
                    processPart(raw.part_A);
                    processPart(raw.part_B);
                    processPart(raw.part_C);
                } else {
                    data = raw;
                }

                data = shuffleArray(data);
                if (count>0) data = data.slice(0,count);

                return data.map((item,i)=>({
                    id: i+1,
                    text: (item.q||'').replace(/\[[^\]]+\]/g,'').trim(),
                    options: item.opts ? shuffleArray([...item.opts]).map(o=>o.replace(/\[[^\]]+\]/g,'').trim()) : [],
                    correct: (item.ans||'').replace(/\[[^\]]+\]/g,'').trim(),
                    explanation: item.exp||''
                }));
            } catch(err) {
                modal.hide();
                modal.show('Lỗi tải dữ liệu',`<div class="text-left bg-red-50 p-3 rounded-lg border border-red-200 text-sm text-red-700">${err.message}</div>`,[{text:'Đóng',class:'bg-ruby text-white'}]);
                return null;
            }
        }

        // --- Start form ---
        document.getElementById('start-form').addEventListener('submit', async e => {
            e.preventDefault();
            const name = document.getElementById('student-name').value.trim();
            const grade = document.getElementById('student-grade').value;
            const round = document.getElementById('exam-round').value;
            const mode = document.getElementById('test-mode').value;
            const passcode = document.getElementById('passcode').value;

            if (passcode!=='1235' && !appState.isTeacher) {
                modal.show('Sai mã xác nhận','Vui lòng nhập đúng mã xác nhận.',[{text:'Thử lại',class:'bg-ruby text-white'}]);
                return;
            }

            appState.studentName = name;
            appState.grade = grade;
            appState.examRoundText = document.getElementById('exam-round').options[document.getElementById('exam-round').selectedIndex].text;

            const topic = mode.split('-')[1];
            const fileName = `json${grade}.vong${round}.${topic}.json`;

            const qs = await fetchQuestions(fileName, 200);
            if (qs && qs.length>0) {
                appState.questions = qs;
                appState.answers = {};
                appState.currentQuestionIndex = 0;
                try { if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); } catch(e){}
                initQuiz();
            } else if (qs && qs.length===0) {
                modal.show('Thông báo','File dữ liệu trống.',[{text:'Đóng',class:'bg-gray-500 text-white'}]);
            }
        });

        function initQuiz() {
            showScreen('screen-quiz');
            closeSidebar();
            document.getElementById('quiz-student-info').textContent = `${appState.studentName} - Lớp ${appState.grade}`;
            document.getElementById('total-q-label').textContent = `/ ${appState.questions.length}`;
            renderQuestionList();
            renderQuestion(0);
            startTimer();
            updateProgress();
        }

        function renderQuestionList() {
            const grid = document.getElementById('question-grid');
            grid.innerHTML = '';
            appState.questions.forEach((q,i) => {
                const btn = document.createElement('button');
                const answered = !!appState.answers[q.id];
                btn.className = `w-full aspect-square rounded-lg font-bold text-xs flex items-center justify-center transition-colors border-2 shadow-sm
                    ${answered ? 'bg-ruby text-white border-ruby' : 'bg-white text-gray-600 border-gray-200 hover:border-ruby'}`;
                btn.textContent = i+1;
                btn.id = `nav-btn-${i}`;
                btn.onclick = () => { renderQuestion(i); closeSidebar(); };
                grid.appendChild(btn);
            });
            updateAnsweredCount();
        }

        function renderQuestion(index) {
            if (index<0||index>=appState.questions.length) return;
            const old = document.getElementById(`nav-btn-${appState.currentQuestionIndex}`);
            if (old) old.classList.remove('ring-4','ring-red-200');

            appState.currentQuestionIndex = index;
            const q = appState.questions[index];

            const cur = document.getElementById(`nav-btn-${index}`);
            if (cur) {
                cur.classList.add('ring-4','ring-red-200');
                cur.scrollIntoView({behavior:'smooth',block:'nearest'});
            }

            document.getElementById('current-q-label').textContent = `Câu ${index+1}`;
            document.getElementById('question-text').innerHTML = q.text;

            const opts = document.getElementById('options-container');
            opts.innerHTML = '';

            if (q.options && q.options.length>0) {
                const labels=['A','B','C','D','E','F'];
                q.options.forEach((opt,i)=>{
                    const sel = appState.answers[q.id]===opt;
                    const btn = document.createElement('button');
                    btn.className = `w-full text-left py-3 px-4 rounded-xl border-2 transition-all flex items-center gap-3
                        ${sel ? 'border-ruby bg-red-50' : 'border-gray-200 bg-white hover:border-ruby/50 hover:bg-gray-50'}`;
                    btn.innerHTML = `
                        <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shrink-0 transition-colors
                            ${sel ? 'bg-ruby text-white' : 'bg-gray-100 text-gray-500'}">
                            ${labels[i]}
                        </div>
                        <div class="text-gray-800 font-medium text-sm sm:text-base flex-1">${opt}</div>
                        <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0
                            ${sel ? 'border-ruby bg-ruby' : 'border-gray-300'}">
                            ${sel ? '<div class="w-2 h-2 bg-white rounded-full"></div>' : ''}
                        </div>`;
                    btn.onclick = () => selectOption(q.id, opt);
                    opts.appendChild(btn);
                });
            } else {
                opts.innerHTML = `
                    <label class="text-sm font-semibold text-gray-500 mb-1 block">Gõ từ/cụm từ còn thiếu:</label>
                    <input type="text" id="fill-answer-input" autocomplete="off" autocorrect="off" spellcheck="false"
                        class="w-full px-4 py-3.5 rounded-xl border-2 border-gray-200 focus:border-ruby focus:ring-2 focus:ring-red-100 outline-none transition-all text-base font-medium text-gray-800"
                        placeholder="Nhập đáp án...">`;
                const inp = document.getElementById('fill-answer-input');
                inp.value = appState.answers[q.id]||'';
                inp.addEventListener('input', e => inputTextAnswer(q.id, e.target.value));
                inp.focus();
            }

            const prev = document.getElementById('btn-prev');
            const next = document.getElementById('btn-next');
            prev.classList.toggle('invisible', index===0);
            if (index===appState.questions.length-1) {
                next.innerHTML = '<i class="fas fa-check mr-1.5"></i> Hoàn thành';
                next.className = next.className.replace(/bg-gray-800|hover:bg-black/g,'');
                next.classList.add('bg-green-600','hover:bg-green-700');
            } else {
                next.innerHTML = 'Tiếp theo <i class="fas fa-arrow-right ml-1.5"></i>';
                next.classList.remove('bg-green-600','hover:bg-green-700');
                next.classList.add('bg-gray-800','hover:bg-black');
            }
        }

        function selectOption(qid, opt) {
            appState.answers[qid] = opt;
            renderQuestion(appState.currentQuestionIndex);
            const btn = document.getElementById(`nav-btn-${appState.currentQuestionIndex}`);
            if (btn) {
                btn.className = btn.className.replace(/bg-white|text-gray-600|border-gray-200/g,'');
                btn.classList.add('bg-ruby','text-white','border-ruby');
            }
            updateAnsweredCount();
            updateProgress();
        }

        function inputTextAnswer(qid, val) {
            if (val.trim()==='') delete appState.answers[qid];
            else appState.answers[qid] = val;
            const btn = document.getElementById(`nav-btn-${appState.currentQuestionIndex}`);
            if (btn) {
                const answered = !!appState.answers[qid];
                btn.classList.toggle('bg-ruby', answered);
                btn.classList.toggle('text-white', answered);
                btn.classList.toggle('border-ruby', answered);
                btn.classList.toggle('bg-white', !answered);
                btn.classList.toggle('text-gray-600', !answered);
                btn.classList.toggle('border-gray-200', !answered);
            }
            updateAnsweredCount();
            updateProgress();
        }

        function getFillAnswer(txt) {
            const m = txt.match(/^(.*?)\s*\(/);
            return (m ? m[1] : txt).trim().toLowerCase();
        }

        function isAnswerCorrect(q) {
            const a = appState.answers[q.id];
            if (a===undefined) return false;
            if (q.options&&q.options.length>0) return a===q.correct;
            return a.trim().toLowerCase()===getFillAnswer(q.correct);
        }

        function updateAnsweredCount() {
            const n = Object.keys(appState.answers).length;
            const t = appState.questions.length;
            const txt = `${n}/${t}`;
            document.getElementById('answered-count').textContent = txt;
            document.getElementById('answered-count-mobile').textContent = txt;
        }

        function updateProgress() {
            const p = (Object.keys(appState.answers).length/appState.questions.length)*100;
            document.getElementById('progress-bar').style.width = `${p}%`;
        }

        document.getElementById('btn-prev').onclick = () => renderQuestion(appState.currentQuestionIndex-1);
        document.getElementById('btn-next').onclick = () => {
            if (appState.currentQuestionIndex===appState.questions.length-1) confirmSubmit();
            else renderQuestion(appState.currentQuestionIndex+1);
        };
        document.getElementById('btn-submit-top').onclick = confirmSubmit;

        function startTimer() {
            appState.timeElapsed = 0;
            appState.timerInterval = setInterval(()=>{
                appState.timeElapsed++;
                document.getElementById('timer').textContent = formatTime(appState.timeElapsed);
            },1000);
        }

        function stopTimer() {
            clearInterval(appState.timerInterval);
            try { if(document.fullscreenElement) document.exitFullscreen(); } catch(e){}
        }

        function confirmSubmit() {
            const answered = Object.keys(appState.answers).length;
            const total = appState.questions.length;
            if (appState.isTeacher) { submitQuiz(); return; }
            if (answered<total) {
                modal.show('Chưa hoàn thành',`Bạn mới làm ${answered}/${total} câu. Có chắc muốn nộp không?`,[
                    {text:'Làm tiếp',class:'bg-gray-200 text-gray-800'},
                    {text:'Nộp bài',class:'bg-ruby text-white',onClick:submitQuiz}
                ],'fa-question-circle','text-yellow-500');
            } else {
                modal.show('Xác nhận nộp bài','Bạn đã hoàn thành tất cả câu hỏi. Nộp bài?',[
                    {text:'Xem lại',class:'bg-gray-200 text-gray-800'},
                    {text:'Nộp bài',class:'bg-ruby text-white',onClick:submitQuiz}
                ],'fa-check-circle','text-green-500');
            }
        }

        function submitQuiz() {
            stopTimer();
            showScreen('screen-result');
            let correct = 0;
            appState.questions.forEach(q => { if(isAnswerCorrect(q)) correct++; });
            const total = appState.questions.length;
            const wrong = total-correct;
            const score = correct*POINTS_PER_QUESTION;
            const pct = Math.round((correct/total)*100);

            document.getElementById('result-name-class').textContent = `${appState.studentName} - Lớp ${appState.grade} (${appState.examRoundText})`;
            document.getElementById('stat-correct').textContent = correct;
            document.getElementById('stat-wrong').textContent = wrong;
            document.getElementById('stat-time').textContent = formatTime(appState.timeElapsed);
            document.getElementById('score-text').textContent = `${score} / ${total*POINTS_PER_QUESTION} điểm`;

            let cur = 0;
            const pctEl = document.getElementById('score-percent');
            const circle = document.getElementById('score-circle');
            const iv = setInterval(()=>{
                if (cur>=pct) {
                    clearInterval(iv);
                    setTimeout(()=>{
                        if (pct>=85&&pct<100&&!appState.retryMode&&!appState.isTeacher) {
                            modal.show('Tuyệt vời!',`Bạn đạt ${pct}%! Muốn làm lại câu sai không?`,[
                                {text:'Bỏ qua',class:'bg-gray-200 text-gray-800'},
                                {text:'Làm lại',class:'bg-green-500 text-white',onClick:startRetryMode}
                            ],'fa-star','text-yellow-400');
                        } else {
                            modal.show('Hoàn thành','Hãy chụp màn hình kết quả và gửi cho giáo viên!',[{text:'Đã hiểu',class:'bg-ruby text-white'}]);
                        }
                    },800);
                } else {
                    cur++;
                    pctEl.textContent = `${cur}%`;
                    circle.style.strokeDashoffset = 283-(283*cur/100);
                }
            },20);
        }

        function startRetryMode() {
            appState.retryMode = true;
            appState.questions = appState.questions.filter(q=>!isAnswerCorrect(q));
            appState.answers = {};
            appState.currentQuestionIndex = 0;
            appState.timeElapsed = 0;
            initQuiz();
        }

        document.getElementById('btn-review').onclick = () => {
            showScreen('screen-review');
            const container = document.getElementById('review-container');
            container.innerHTML = '';
            appState.questions.forEach((q,i)=>{
                const ok = isAnswerCorrect(q);
                const card = document.createElement('div');
                card.className = `bg-white p-4 sm:p-6 rounded-2xl shadow-sm border-l-4 ${ok?'border-green-500':'border-red-500'}`;
                let optsHtml='';
                if (q.options&&q.options.length>0) {
                    const L=['A','B','C','D','E','F'];
                    q.options.forEach((opt,j)=>{
                        const isUser=appState.answers[q.id]===opt;
                        const isAns=q.correct===opt;
                        let bg='bg-gray-50',txt='text-gray-700',border='border-gray-200',icon='';
                        if(isAns){bg='bg-green-50';txt='text-green-800 font-bold';border='border-green-300';icon='<i class="fas fa-check-circle text-green-500 ml-2"></i>';}
                        else if(isUser&&!ok){bg='bg-red-50';txt='text-red-800';border='border-red-300';icon='<i class="fas fa-times-circle text-red-500 ml-2"></i>';}
                        optsHtml+=`<div class="p-2.5 rounded-lg border ${border} ${bg} ${txt} flex items-center justify-between text-sm">
                            <div class="flex items-center gap-2">
                                <span class="w-6 h-6 rounded-full bg-white border flex items-center justify-center text-xs ${isAns?'border-green-500 text-green-600':isUser?'border-red-500 text-red-600':'border-gray-300 text-gray-500'}">${L[j]}</span>
                                <span>${opt}</span>
                            </div>${icon}</div>`;
                    });
                } else {
                    const uv=appState.answers[q.id];
                    const ud=uv!==undefined?escapeHtml(uv):'(Chưa trả lời)';
                    optsHtml=`
                        <div class="p-2.5 rounded-lg border text-sm ${ok?'border-green-300 bg-green-50':'border-red-300 bg-red-50'}">
                            <span class="text-gray-500">Bạn trả lời: </span>
                            <span class="font-bold ${ok?'text-green-800':'text-red-800'}">${ud}</span>
                        </div>
                        <div class="p-2.5 rounded-lg border border-green-300 bg-green-50 text-sm">
                            <span class="text-gray-500">Đáp án đúng: </span>
                            <span class="font-bold text-green-800">${escapeHtml(q.correct)}</span>
                        </div>`;
                }
                card.innerHTML=`
                    <div class="flex justify-between items-start mb-3 gap-2">
                        <h4 class="font-bold text-gray-800 text-sm sm:text-base flex-1">Câu ${i+1}: ${q.text}</h4>
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold shrink-0 ${ok?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">${ok?'Đúng':'Sai'}</span>
                    </div>
                    <div class="space-y-1.5 mb-3">${optsHtml}</div>
                    ${q.explanation?`<div class="bg-blue-50 border border-blue-100 rounded-lg p-3 text-blue-800 text-xs"><i class="fas fa-lightbulb text-yellow-500 mr-1"></i><b>Giải thích:</b> ${q.explanation}</div>`:''}`;
                container.appendChild(card);
            });
        };

        document.getElementById('btn-back-result').onclick = () => showScreen('screen-result');
    </script>
</body>
</html>
